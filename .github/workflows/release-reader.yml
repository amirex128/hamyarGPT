name: Build PDF Reader Releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aava-pdf-reader-linux
          - os: windows-latest
            artifact: aava-pdf-reader-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI/runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python/build dependencies
        working-directory: desktop/pdf-reader
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller torch
      - name: Source self-test
        working-directory: desktop/pdf-reader
        run: python pdf_reader.py --self-test
      - name: Build executable
        working-directory: desktop/pdf-reader
        run: pyinstaller --clean --noconfirm aava-pdf-reader.spec
      - name: Package Linux
        if: runner.os == 'Linux'
        working-directory: desktop/pdf-reader
        run: cp install-linux.sh ../../aava-pdf-reader-linux-installer.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: desktop/pdf-reader
        shell: pwsh
        run: Compress-Archive -Path dist/aava-pdf-reader.exe -DestinationPath ../../aava-pdf-reader-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            aava-pdf-reader-linux-installer.sh
            aava-pdf-reader-windows.zip
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aava PDF Reader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            aava-pdf-reader-linux-installer.sh
            aava-pdf-reader-windows.zip
